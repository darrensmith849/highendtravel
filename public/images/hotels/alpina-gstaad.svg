<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="40%" stop-color="#1a3a6a"/>
      <stop offset="70%" stop-color="#4a6a9a"/>
      <stop offset="100%" stop-color="#8aaaca"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf0"/>
      <stop offset="100%" stop-color="#c8d0e0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="150" cy="50" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="350" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="550" cy="55" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="700" cy="35" r="1" fill="white" opacity="0.4"/>
  <circle cx="250" cy="80" r="1" fill="white" opacity="0.5"/>
  <!-- Distant mountain range -->
  <path d="M0 300 L100 200 L180 250 L280 160 L380 220 L450 150 L520 210 L600 170 L700 230 L800 180 L800 500 L0 500Z" fill="#3a4a6a" opacity="0.5"/>
  <!-- Snow caps on distant mountains -->
  <path d="M260 180 L280 160 L300 180Z" fill="white" opacity="0.3"/>
  <path d="M430 170 L450 150 L470 170Z" fill="white" opacity="0.3"/>
  <path d="M580 190 L600 170 L620 190Z" fill="white" opacity="0.3"/>
  <!-- Main mountain -->
  <path d="M100 350 L350 180 L600 350Z" fill="#4a5a7a" opacity="0.7"/>
  <!-- Snow on main mountain -->
  <path d="M300 220 L350 180 L400 220 Q370 230 350 225 Q330 230 300 220Z" fill="url(#snow)" opacity="0.8"/>
  <!-- Snowy ground -->
  <path d="M0 370 Q200 360 400 370 Q600 365 800 370 L800 500 L0 500Z" fill="url(#snow)"/>
  <!-- Pine trees -->
  <polygon points="80,310 95,370 65,370" fill="#1a3a2a" opacity="0.8"/>
  <polygon points="80,325 90,355 70,355" fill="#1a3a2a" opacity="0.7"/>
  <polygon points="120,320 133,365 107,365" fill="#1a3a2a" opacity="0.75"/>
  <polygon points="680,315 695,370 665,370" fill="#1a3a2a" opacity="0.8"/>
  <polygon points="720,320 732,365 708,365" fill="#1a3a2a" opacity="0.75"/>
  <polygon points="750,325 760,365 740,365" fill="#1a3a2a" opacity="0.7"/>
  <!-- The Alpina Gstaad hotel -->
  <rect x="320" y="330" width="160" height="40" rx="2" fill="#5a4a3a" opacity="0.85"/>
  <path d="M310 330 L400 300 L490 330Z" fill="#4a3a2a" opacity="0.85"/>
  <!-- Chalet details -->
  <rect x="340" y="340" width="15" height="15" fill="#e8c85a" opacity="0.6"/>
  <rect x="365" y="340" width="15" height="15" fill="#e8c85a" opacity="0.7"/>
  <rect x="390" y="340" width="15" height="15" fill="#e8c85a" opacity="0.6"/>
  <rect x="420" y="340" width="15" height="15" fill="#e8c85a" opacity="0.5"/>
  <rect x="445" y="340" width="15" height="15" fill="#e8c85a" opacity="0.7"/>
  <!-- Hotel entrance warm glow -->
  <rect x="385" y="355" width="25" height="15" fill="#e8c85a" opacity="0.4"/>
  <!-- Snow particles -->
  <circle cx="200" cy="250" r="2" fill="white" opacity="0.4"/>
  <circle cx="450" cy="280" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="600" cy="300" r="2" fill="white" opacity="0.35"/>
  <circle cx="350" cy="260" r="1.5" fill="white" opacity="0.3"/>
</svg>